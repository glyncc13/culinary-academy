name: Release checks
on:
  push:
    branches: [v2-admin-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
      - run: find netlify/functions -name '*.js' -exec node --check {} \;
      - name: Require committed lockfile
        run: test -f package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: git diff --exit-code -- package.json package-lock.json
  lockfile-candidate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-lockfile-candidate
          path: package-lock.json
      - run: npm audit --audit-level=high
      - name: Commit verified lockfile once
        if: github.ref == 'refs/heads/v2-admin-development'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Existing lockfile retained for review'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Commit audited dependency lockfile for RC1'
          git push origin HEAD:refs/heads/v2-admin-development
