name: Release checks
on:
  push:
    branches: [v2-admin-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
      - run: for f in netlify/functions/*.js; do node --check "$f" || exit 1; done
      - name: Require committed lockfile
        run: test -f package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: git diff --exit-code -- package.json package-lock.json
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: academy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: academy_ci
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
      - name: Replay migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: psql -v ON_ERROR_STOP=1 -f tests/database-integration.sql
      - run: bash tests/database-concurrency.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --prefix /tmp/academy-browser --no-save --ignore-scripts playwright@1.58.2
      - run: /tmp/academy-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/academy-browser/node_modules node tests/browser.cjs
